openapi: 3.0.0
info:
  title: 校园互助系统 (Help System) API
  description: 提供校园任务互助、积分管理及用户认证相关的 API 接口。
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: 本地开发服务器
paths:
  /tasks/{id}/accept:
    post:
      summary: 学生接取任务
      description: 根据任务ID和学生ID接取任务。
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          description: 任务ID
          schema:
            type: integer
            format: int64
        - name: studentId
          in: query
          required: true
          description: 接单学生的ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 接单成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
  /tasks/{id}/complete:
    post:
      summary: 任务完成与积分划转
      description: 标记任务为完成状态，并将积分从发布者划转给接单者。
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          description: 任务ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 任务已完成，积分已划转
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
  /users/login:
    post:
      summary: 用户登录
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 登录成功，返回Token

components:
  schemas:
    Result:
      type: object
      properties:
        code:
          type: integer
          description: 状态码 (200为成功)
        msg:
          type: string
          description: 提示信息
        data:
          type: object
          description: 返回的数据对象
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        publisherId:
          type: integer
          format: int64
        acceptorId:
          type: integer
          format: int64
        category:
          type: string
        title:
          type: string
        description:
          type: string
        pointsReward:
          type: integer
        status:
          type: integer
          description: 0待审, 1待接, 2进行中, 3完成
        deadline:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time