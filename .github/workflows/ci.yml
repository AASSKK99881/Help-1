name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    
    # 根据 docker-compose.yml 启动 MySQL 服务容器供测试使用
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: help_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      # 设置 Java 17 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          
      # 运行 Maven 测试并生成 Jacoco 覆盖率报告
      # 根据 docker-compose.yml，后端代码位于 backend/help 目录下
      - name: Run Maven Tests & Generate Coverage
        working-directory: backend/help
        run: mvn -B clean test
        env:
          # 注入环境变量供 Spring Boot 连接 CI 中的 MySQL 服务[cite: 2]
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/help_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root_password
          
      # 上传 Jacoco 生成的 XML 覆盖率报告到 Codecov
      - name: Upload Backend Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/help/target/site/jacoco/jacoco.xml
          flags: backend

  # frontend 部分保持原样，直接接在下面即可
  frontend:
    # ... (保持你 source 3 中原有的 frontend 配置不变)