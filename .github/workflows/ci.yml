name: CI
on:
  push:
    [cite_start]branches: [main, develop] # 当推送到 main 或 develop 分支时触发 [cite: 11]
  pull_request:
    [cite_start]branches: [main] # 当针对 main 分支创建 PR 时触发 [cite: 13]

jobs:
  # 后端任务：Java + Maven + MySQL
  backend:
    runs-on: ubuntu-latest
    
    # 配置数据库服务容器 [cite: 58, 60]
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: help_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - [cite_start]uses: actions/checkout@v4 # 检出代码 [cite: 18]

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # 启用 Maven 依赖缓存

      # 运行测试并生成 Jacoco 覆盖率报告 [cite: 25, 88]
      # 环境变量用于连接上方启动的 MySQL 服务 
      - name: Run Maven Tests & Generate Coverage
        working-directory: backend/help # 指定后端项目根目录
        run: mvn -B clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/help_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root_password

      # 上传后端覆盖率报告到 Codecov [cite: 26, 165]
      - name: Upload Backend Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/help/target/site/jacoco/jacoco.xml
          [cite_start]flags: backend # 区分后端标识 [cite: 30]

  # 前端任务：Node.js + Vue
  frontend:
    runs-on: ubuntu-latest
    env:
      [cite_start]VITE_API_URL: http://localhost:3000 # 注入测试环境变量 [cite: 120]
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          [cite_start]node-version: '20' # 使用 Node 20 [cite: 37]
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
          
      - name: Install Dependencies
        [cite_start]run: npm ci --prefix frontend # 安装前端依赖 [cite: 39]
        
      - name: Run ESLint
        [cite_start]run: npm run lint --prefix frontend # 执行 Lint 检查 [cite: 40, 127]
        
      - name: Run Tests & Generate Coverage
        [cite_start]run: npm test --prefix frontend # 执行测试并生成覆盖率 [cite: 41, 127]
        
      - name: Upload Frontend Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          [cite_start]flags: frontend # 区分前端标识 [cite: 45]
