services:
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-aasskk99881/help-1}/frontend:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - app-network

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-aasskk99881/help-1}/backend:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/help_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD_FILE=/run/secrets/db_password
      - AI_API_KEY_FILE=/run/secrets/ai_api_key
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    secrets:
      - db_password
      - ai_api_key
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: help_db
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    secrets:
      - db_password
    networks:
      - app-network

volumes:
  mysql_prod_data:
networks:
  app-network:
    driver: bridge
secrets:
  db_password:
    file: ./secrets/db_password.txt
  ai_api_key:
    file: ./secrets/ai_api_key.txt
