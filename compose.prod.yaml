services:
  frontend:
    # 生产环境使用构建好的远程镜像（供 GitHub Actions 使用）
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:8080" # 将主机的 80 端口映射到我们非 root Nginx 的 8080 端口
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/prod
      - SPRING_DATASOURCE_USERNAME=postgres
      # 生产环境密码通过外部传入或后续挂载的 secret 读取
      - SPRING_DATASOURCE_PASSWORD=${PROD_DB_PASSWORD} 
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prod
      # 根据作业要求，使用 Docker Secrets 管理数据库根密码
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgproddata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    secrets:
      - db_password

volumes:
  pgproddata:

secrets:
  db_password:
    file: ./secrets/db_password.txt