spring.application.name=help
server.port=8080

# 本地开发使用 localhost，Docker 部署时 compose 会注入环境变量覆盖
spring.datasource.url=jdbc:mysql://localhost:3306/help_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case=true

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# AI 配置 (DeepSeek)
ai.api-key=${AI_API_KEY:}
ai.base-url=https://api.deepseek.com/v1
ai.model=deepseek-chat